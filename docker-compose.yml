services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: regression
      POSTGRES_USER: regression
      POSTGRES_PASSWORD: regression
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U regression -d regression"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  wiremock:
    image: wiremock/wiremock:3.13.1
    command: ["--global-response-templating", "--disable-banner", "--port", "8081"]
    ports:
      - "8081:8081"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings:ro
      - ./wiremock/__files:/home/wiremock/__files:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -H 'X-Demo-Scenario: healthy' http://localhost:8081/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  mcp-regression-platform:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      wiremock:
        condition: service_started
    environment:
      PLATFORM_DB_URL: jdbc:postgresql://postgres:5432/regression
      PLATFORM_DB_USERNAME: regression
      PLATFORM_DB_PASSWORD: regression
      PLATFORM_REDIS_HOST: redis
      PLATFORM_ACCOUNT_SERVICE_URL: http://wiremock:8081
      PLATFORM_ACCOUNT_SERVICE_API_KEY: ${PLATFORM_ACCOUNT_SERVICE_API_KEY:-demo-service-api-key}
      PLATFORM_JWT_SIGNING_KEY: ${PLATFORM_JWT_SIGNING_KEY:-local-development-signing-key-32-chars-min}
      PLATFORM_DEV_PASSWORD: ${PLATFORM_DEV_PASSWORD:-dev-password}
      PLATFORM_QA_PASSWORD: ${PLATFORM_QA_PASSWORD:-qa-password}
      PLATFORM_ARCHITECT_PASSWORD: ${PLATFORM_ARCHITECT_PASSWORD:-architect-password}
      PLATFORM_DEMO_SCENARIO: ${PLATFORM_DEMO_SCENARIO:-healthy}
      PLATFORM_REASONING_ENABLED: ${PLATFORM_REASONING_ENABLED:-false}
      PLATFORM_CHAT_MODEL: ${PLATFORM_CHAT_MODEL:-none}
      PLATFORM_EMBEDDING_MODEL: ${PLATFORM_EMBEDDING_MODEL:-none}
      SPRING_AI_OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health/readiness || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.5.1
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
